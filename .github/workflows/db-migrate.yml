name: D1 migrations
# Owner-run only: Actions → "D1 migrations" → Run workflow. Applies pending SQL migrations from
# apps/backend/migrations to the chosen environment's D1. Agents never trigger it.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, production]
        default: dev
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    # Same GitHub environments as deploy: they scope the Cloudflare secrets and let the owner
    # require approval for production.
    environment: ${{ inputs.environment }}
    concurrency:
      group: d1-migrate-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_ENV: ${{ inputs.environment }}
    steps:
      # Migrations come only from the branch that deploys that environment. This step is a guard
      # against mistakes, not a security boundary (an edited copy on another branch could drop it):
      # the GitHub environment's deployment-branch rule (dev → develop, production → main) is.
      - name: Check branch
        shell: bash
        run: |
          expected=develop
          if [[ "$TARGET_ENV" == "production" ]]; then expected=main; fi
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "::error::$TARGET_ENV migrations run only from '$expected' (got '$GITHUB_REF_NAME')"
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Select database
        shell: bash
        run: |
          if [[ "$TARGET_ENV" == "production" ]]; then
            echo "D1_NAME=content-db-prod" >> "$GITHUB_ENV"
          else
            echo "D1_NAME=content-db-dev" >> "$GITHUB_ENV"
          fi

      - name: Pending migrations
        working-directory: apps/backend
        run: npx wrangler d1 migrations list "$D1_NAME" --remote --env "$TARGET_ENV"

      - name: Apply migrations
        working-directory: apps/backend
        run: npx wrangler d1 migrations apply "$D1_NAME" --remote --env "$TARGET_ENV"
