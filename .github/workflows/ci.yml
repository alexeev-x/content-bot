name: CI
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # Full independent gate; the local pre-push hook runs only the affected checks.
      - run: npm run verify
      - if: failure()
        run: cat .logs/verify.log
      # Production dependencies only: a dev-tool advisory must not block a release.
      - run: npm audit --omit=dev --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The whole history: a token committed and later deleted is still leaked.
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --no-banner

  deploy:
    if: github.event_name == 'push'
    needs: [verify, secrets]
    runs-on: ubuntu-latest
    # GitHub environments scope the Cloudflare secrets and let the owner require approval for production.
    environment: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
    concurrency:
      group: cloudflare-deploy-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts

      # The Cloudflare Vite plugin resolves the named environment at build time.
      - name: Select Cloudflare environment
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            echo "CLOUDFLARE_ENV=production" >> "$GITHUB_ENV"
          else
            echo "CLOUDFLARE_ENV=dev" >> "$GITHUB_ENV"
          fi

      - name: Build for Cloudflare
        run: npm run build -w @alexeev/frontend

      - name: Deploy Worker
        run: npm run deploy -w @alexeev/frontend
