name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test:architecture
      - run: npm test
      - run: npm install --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
