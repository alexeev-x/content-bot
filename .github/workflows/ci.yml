name: CI
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  # Full independent gate (the local pre-push hook runs only the affected checks), split across runners:
  # on one small runner the two test suites and tsc starve each other for CPU. Together the parts cover
  # every verify step (see the --only/--skip test in .agents/scripts/hooks.test.mjs).
  verify:
    name: verify (${{ matrix.part }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: checks
            steps: --skip backend-tests,frontend-tests
          - part: backend-tests
            steps: --only backend-tests
          - part: frontend-tests
            steps: --only frontend-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify -- ${{ matrix.steps }}
      - if: failure()
        run: cat .logs/verify.log
      # Production dependencies only: a dev-tool advisory must not block a release.
      - if: matrix.part == 'checks'
        run: npm audit --omit=dev --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The whole history: a token committed and later deleted is still leaked.
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --config /repo/.gitleaks.toml --redact --verbose --no-banner

  deploy:
    if: github.event_name == 'push'
    needs: [verify, secrets]
    runs-on: ubuntu-latest
    # GitHub environments scope the Cloudflare secrets and let the owner require approval for production.
    environment: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
    concurrency:
      group: cloudflare-deploy-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts

      # The Cloudflare Vite plugin resolves the named environment at build time.
      - name: Select Cloudflare environment
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            echo "CLOUDFLARE_ENV=production" >> "$GITHUB_ENV"
          else
            echo "CLOUDFLARE_ENV=dev" >> "$GITHUB_ENV"
          fi

      # Plain `vite build`: the verify job already type-checked this commit.
      - name: Build for Cloudflare
        run: npm exec -w @alexeev/frontend -- vite build

      - name: Deploy Worker
        run: npm run deploy -w @alexeev/frontend
