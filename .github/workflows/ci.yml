name: CI
on:
  pull_request:
  push:
    branches: [main, develop]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # Same command as the pre-push hook: format, lint, docs, agents, types, architecture, tests, build.
      - run: npm run verify
      - if: failure()
        run: cat .logs/verify.log
