<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>ALEXEEV Studio • Composer mockup</title><style>
:root{--bg:#0a0a0b;--panel:#111113;--panel2:#18181b;--panel3:#1c1d20;--line:#26272b;--line2:#32343b;--txt:#ededef;--muted:#a1a1aa;--quiet:#71717a;--blue:#2563eb;--blue2:#18294c;--green:#36ad74;--red:#d2605b;font-family:Arial,'DejaVu Sans',sans-serif;font-synthesis:none;color:var(--txt)}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-size:14px}.app{max-width:1500px;margin:auto;padding:24px 29px 24px;min-height:100vh}.top{display:flex;align-items:center;gap:15px;margin-bottom:20px}.back{font-size:14px;color:var(--muted);padding:9px 0;margin-right:8px}.slash{height:27px;width:1px;background:var(--line)}.h1{font-size:20px;letter-spacing:-.4px;font-weight:650}.save{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.dot{width:7px;height:7px;background:var(--green);border-radius:100%}.topright{margin-left:auto;color:var(--muted);font-size:12px}.tabs{display:flex;gap:1px;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;width:max-content;margin-bottom:16px}.tab{border:0;background:transparent;color:var(--muted);font:inherit;padding:11px 25px;min-width:148px;display:flex;gap:9px;align-items:center;justify-content:center}.tab.active{background:#202431;color:var(--txt);box-shadow:inset 0 -2px 0 var(--blue);font-weight:600}.tab svg{width:15px;height:15px}.columns{display:grid;grid-template-columns:minmax(0,1.85fr) minmax(330px,1fr);gap:16px;align-items:start}.left{min-width:0}.writer{background:transparent;border:none;border-radius:0;overflow:visible}.toolbar{display:flex;align-items:center;gap:1px;padding:9px 13px;border-bottom:1px solid var(--line);min-height:45px}.tool{font-size:15px;width:31px;height:29px;display:flex;justify-content:center;align-items:center;color:#d5d6db;border-radius:5px;font-weight:bold}.tool.sep{margin-left:9px;padding-left:15px;border-left:1px solid var(--line);width:46px}.tool.emoji{color:var(--txt);background:var(--panel3);border:1px solid #33353b}.t-end{margin-left:auto;di ;font-weight:650}.platform{display:flex;align-items:center;gap:8px}.previewbody{padding:18px;background:#0e1115;min-height:295px;display:flex;justify-content:center;align-items:flex-start}.chatbubble{width:100%;max-width:367px;border-radius:12px;background:#1a2834;padding:13px 13px 14px;min-height:120px}.chatname{display:flex;align-items:center;gap:9px;margin-bottom:14px}.avatar{width:30px;height:30px;border-radius:50%;background:#24272c;display:flex;align-items:center;justify-content:center;color:#eaeaf0;font-weight:bold}.chat-title{color:#8dbdfc;font-size:13px;font-weight:650}.chatsub{color:#a4b0bd;font-size:11px;margin-top:1px}.photoph{height:134px;width:100%;border-radius:6px;background:#222b33;border:1px dashed #5a626f;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;color:#b5bfca;margin-bottom:11px}.chattext{line-height:1.6;font-size:13px;white-space:pre-wrap}.emptyPreview{color:#95a2b0;font-style:italic}.previewfoot{padding:9px 13px;color:var(--quiet);font-size:11px;border-top:1px solid var(--line);background:var(--panel)}.footer{display:flex;justify-content:space-between;align-items:center;padding:22px 0 4px;gap:12px}.footleft{display:flex;align-items:center;gap:12px}.footright{display:flex;align-items:center;gap:8px}.draftnote{color:var(--muted);font-size:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:14px}.paneltitle{font-size:15px;font-weight:650;margin-bottom:15px}.label{font-size:12px;color:#d6d6da;font-weight:600;margin-bottom:7px}.input{background:#141416;border:1px solid #36373d;color:#dddfe4;border-radius:7px;min-height:42px;padding:12px;display:flex;align-items:center;font-size:13px;line-height:1.4;margin-bottom:12px}.input.placeholder{color:#787a84}.muted{color:var(--muted)}.formrow{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:12px 0}.formrow:first-child{border:0}.toggle{width:31px;height:18px;background:#373940;border-radius:20px;display:inline-block;position:relative;flex:none}.toggle:after{content:'';display:block;height:12px;width:12px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px}.toggle.on{background:var(--blue)}.toggle.on:after{left:16px}.info{border:1px solid #2c3543;background:#131a24;border-radius:7px;padding:12px 14px;color:#acbace;line-height:1.55;font-size:13px}.minirow{display:flex;gap:8px;align-items:center}.paper{color:#c6ccd3;padding:5px 0}.pill{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:#1c1c1f;white-space:nowrap;font-size:12px}.req{font-size:11px;color:#8b9bae;background:#1c2026;padding:5px 8px;border-radius:5px}.poll-preview{padding:11px 0}.pollitem{border-top:1px solid #304452;padding:10px 0;font-size:13px;display:flex;gap:8px;align-items:center}.circle{width:15px;height:15px;border:1.5px solid #8d9fb4;border-radius:50%}.screen-label{font-size:11px;color:#8b939f;letter-spacing:.8px;text-transform:uppercase;display:none}.note{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.45}.aiDialogBack{position:fixed;z-index:100;inset:0;background:rgba(0,0,0,.73);display:flex;align-items:center;justify-content:center;padding:20px}.aiDialog{background:#161619;border:1px solid #393a41;border-radius:11px;width:min(880px,calc(100vw - 40px));box-shadow:0 24px 80px #0009}.dialogHeader{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}.compare{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.compare-box{border:1px solid #37383e;border-radius:8px;padding:15px;min-height:182px;background:#141416}.compare-label{font-size:12px;color:var(--muted);margin-bottom:15px;font-weight:600}.comparebody{line-height:1.65;font-size:14px}.dialogbottom{display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line);padding:14px 20px}.aiFlag{font-size:12px;color:#a5badb;margin:0 20px 14px}.emojiPop{position:absolute;background:#1a1b1e;border:1px solid #383a42;border-radius:9px;width:284px;z-index:5;box-shadow:0 16px 45px #0008;top:46px;left:208px;padding:12px}.emojiSearch{border:1px solid #3a3d44;color:#868b95;background:#111113;padding:10px;border-radius:6px;font-size:12px}.emojiGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;padding-top:14px;font-size:23px;text-align:center}.emojiCaption{font-size:11px;color:var(--muted);margin-top:12px}.writer{position:relative}.demo-tag{display:inline-block;border-radius:4px;background:#202125;color:#97989f;font-size:10px;padding:4px 7px}.draftsummary{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}.tall-empty{height:72px;display:flex;align-items:center;justify-content:center;color:#828691;font-size:12px;border:1px dashed #303137;border-radius:7px}
.mobile .app{padding:15px 14px 88px}.mobile .top{gap:9px;margin-bottom:15px}.mobile .back{font-size:0}.mobile .back:before{content:'←';font-size:21px}.mobile .slash{display:none}.mobile .topright{display:none}.mobile .h1{font-size:16px}.mobile .save{font-size:11px}.mobile .tabs{width:100%;margin-bottom:12px}.mobile .tab{min-width:0;flex:1;padding:12px 4px;font-size:12px;gap:5px}.mobile .columns{display:block}.mobile .preview{display:none}.mobile .writing{min-height:170px;padding:14px 13px 8px;font-size:14px}.mobile .toolbar{padding:7px 6px;min-height:44px}.mobile .tool{width:31px;height:30px;font-size:14px}.mobile .tool.sep{margin-left:2px;padding-left:5px;width:37px}.mobile .toolbar .hide-mobile{display:none}.mobile .t-end{gap:5px}.mobile .btn.small{padding:7px 9px}.mobile .actionrow{padding:10px}.mobile .media{padding:13px;margin-top:12px}.mobile .media-row{gap:7px}.mobile .filetile{width:65px;height:65px;font-size:10px}.mobile .attach{height:65px}.mobile .footer{position:fixed;bottom:0;left:0;right:0;background:#0e0e10;padding:11px 14px calc(11px + env(safe-area-inset-bottom));border-top:1px solid #27282d;z-index:10}.mobile .footer .footleft{display:none}.mobile .footer .footright{width:100%}.mobile .footer .footright .btn{flex:1;padding:12px 9px}.mobile .panel{padding:15px}.mobile .paneltitle{font-size:14px}.mobile .preview-mobile{display:block;margin-top:13px;background:var(--panel);border:1px solid var(--line);border-radius:8px}.mobile .preview-mobile .previewhead{height:44px;font-size:13px}.mobile .preview-mobile .previewbody{min-height:85px;padding:12px;display:block}.mobile .preview-mobile .chatbubble{padding:12px;max-width:100%;font-size:12px}.mobile .aiDialogBack{padding:0;align-items:flex-end}.mobile .aiDialog{width:100%;border-radius:14px 14px 0 0;max-height:94vh;overflow:auto;padding-bottom:10px}.mobile .compare{grid-template-columns:1fr;padding:14px;gap:9px}.mobile .compare-box{min-height:105px;padding:12px}.mobile .dialogHeader{padding:14px}.mobile . </style></head><body><div id="root"></div><script>
const p = new URLSearchParams(location.search);let view=p.get('view')||'editor', device=p.get('device')||'desktop',mode=p.get('mode')||''; document.body.className=device;
const icons={editor:'✎',poll:'▥',settings:'⚙',eye:'◉',photo:'▧',ai:'✦'};
const txt='В Dota 2 иногда важнее вовремя отступить, чем уверенно нажать все кнопки. Но объяснить это команде сложнее, чем выиграть драку.';
const txtNew='В Доте есть секретный навык: вовремя уйти из драки. Жаль, что я обычно вспоминаю о нём уже в таверне.';
function btn(label,cls=''){return `<span class="btn ${cls}">${label}</span>`}
function tabs(){return `<nav class="tabs">${[['editor','Редактор'],['poll','Опрос'],['settings','Настройки']].map(([v,n])=>`<div class="tab ${v===view?'active':''}"><span>${icons[v]}</span>${n}</div>`).join('')}</nav>`}
function toolbar(){return `<div class="toolbar"><span class="tool">B</span><span class="tool" style="font-style:italic">I</span><span class="tool" style="text-decoration:underline">U</span><span class="tool" style="text-decoration:line-through">S</span><span class="tool sep">≡</span><span class="tool">⌁</span><span class="tool hide-mobile">❝</span><span class="tool hide-mobile">&lt;/&gt;</span><span class="tool emoji">☺</span><div class="t-end"><span class="tool">⋯</span></div></div>`}
function emoji(){return `<div class="emojiPop"><div class="section-top"><span class="section-name">Выберите эмодзи</span><span>×</span></div><div class="emojiSearch">⌕　Поиск эмодзи…</div><div class="emojiCaption">Часто используемые</div><div class="emojiGrid">${'😂 😭 😅 🤣 😎 👍 🔥 ❤️ 🥲 🫡 🫠 💀 👀 🤔 😍 🫶 😱 ✨ 💜 ⭐ 😊 🙃 😏 😁 😐 💪 🥳 🥹'.split(' ').map(x=>`<span>${x}</span>`).join('')}</div></div>`}
function writer(){return `<div class="writer">${toolbar()}${mode==='emoji'?emoji():''}<div class="writing">${txt}</div><div class="count">${txt.length} / ${mode==='media'?1024:4096}</div><div class="actionrow">${btn('✦ Улучшить через ИИ','small active-soft')}<span class="spacer"></span><span class="sub">Изменения не отправляются автоматически</span></div></div><section class="media"><div class="section-top"><span class="section-name">▧　Фото и видео</span><span class="section-note">Под текстом редактора</span></div><div class="media-row">${mode==='media'?'<div class="filetile"><b>▧</b>Фото 1 · макет</div>':''}<div class="attach"><span style="font-size:23px">＋</span><div><b>Добавить фото или видео</b><div class="sub">Файлы или медиатека</div></div></div></div></section>${device==='mobile'?mobilePreview('Текущая публикация'):''}`}
function chat(){return `<div class="chatbubble"><div class="chatname"><div class="avatar">A</div><div><div class="chat-title">Превью Telegram</div><div class="chatsub">Макет, без статистики</div></div></div>${view==='poll'?`<div class="chattext"><b>Какой формат роликов интереснее?</b></div><div class="poll-preview"><div class="pollitem"><span class="circle"></span> Учу фидить</div><div class="pollitem"><span class="circle"></span> Учусь играть</div></div><div class="chatsub">Голосование ещё не опубликовано</div>`:`${mode==='media'?'<div class="photoph"><span style="font-size:24px">▧</span>Фото 1 · пример вложения</div>':''}<div class="chattext">${txt}</div>`}</div>`}
function preview(){return `<aside class="preview"><div class="previewhead"><div class="platform">◉　 Предпросмотр Telegram</div><div class="demo-tag">МАКЕТ</div></div><div class="previewbody">${chat()}</div><div class="previewfoot">Только фактический текст и вложения · без выдуманных просмотров</div></aside>`}
function mobilePreview(name){return `<div class="preview-mobile"><div class="previewhead">◉　Предпросмотр <span class="muted" style="font-size:12px">Свернуть ⌄</span></div><div class="previewbody">${chat()}</div></div>`}
function poll(){return `<div class="panel"><div class="section-top"><div class="paneltitle" style="margin:0">Новый опрос</div><div class="req">ТРЕБУЕТ API</div></div><div class="label">Вопрос</div><div class="input">Какой формат роликов интереснее?</div><div class="label">Варианты ответов</div><div class="input">Учу фидить</div><div class="input">Учусь играть</div><div class="minirow">${btn('＋ Добавить вариант','small')}<span class="spacer"></span><span class="sub">Не опубликовано</span></div></div><div class="panel"><div class="paneltitle">Настройки опроса</div><div class="formrow">Анонимный опрос <span class="toggle on"></span></div><div class="formrow">Несколько ответов <span class="toggle"></span></div><div class="formrow">Режим викторины <span class="toggle"></span></div><div class="note">Новая функция: необходимы контракты, сохранение и отправка через Telegram Bot API.</div></div>${device==='mobile'?mobilePreview('Опрос'):''}`}
function settings(){return `<div class="panel"><div class="section-top"><div class="paneltitle" style="margin:0">Настройки публикации</div><div class="req">БЕЗ ДУБЛИРОВАНИЯ</div></div><div class="info">Канал, дата и время выбираются на отдельном финальном шаге «К публикации». Здесь не будет второй независимой формы отправки.</div></div><div class="panel"><div class="paneltitle">Этот пост</div><div class="formrow"><span>Тип сообщения</span><span class="muted">Текст и медиа</span></div><div class="formrow"><span>Статус</span><span class="muted">Черновик</span></div><div class="formrow"><span>Сохранение</span><span class="muted">Автоматически</span></div></div><div class="panel"><div class="paneltitle">Дополнительные параметры</div><div class="tall-empty">Появятся только после реализации соответствующих API</div></div>${device==='mobile'?mobilePreview('Публикация'):''}`}
function footer(){return `<footer class="footer"><div class="footleft">${btn('← К постам')}<span class="draftnote">Черновик сохраняется автоматически</span></div><div class="footright">${btn('К публикации　→','primary')}</div></footer>`}
let base=`<main class="app"><div class="top"><span class="back">← К постам</span><span class="slash"></span><div><div class="h1">Создание публикации</div><div class="save"><span class="dot"></span>Черновик сохраняется автоматически</div></div><span class="topright"><span class="demo-tag">UI-концепт • не рабочий экран</span></span></div>${tabs()}<div class="columns"><div class="left">${view==='editor'?writer():view==='poll'?poll():settings()}</div>${preview()}</div>${footer()}</main>`;
if(mode==='compare'){base+=`<div class="aiDialogBack"><section class="aiDialog"><div class="dialogHeader"><div><div class="section-name">✦ Предложение ИИ</div><div class="sub" style="margin-top:6px">Улучшить текст · исходный пост не изменён</div></div><span>✕</span></div><div class="compare"><div class="compare-box"><div class="compare-label">Было · ${txt.length} символов</div><div class="comparebody">${txt}</div></div><div class="compare-box"><div class="compare-label">Стало · ${txtNew.length} символов</div><div class="comparebody">${txtNew}</div></div></div><div class="aiFlag">Предложение модели не применяется без вашего подтверждения. Другой вариант — отдельный платный запрос.</div><div class="dialogbottom">${btn('Отмена')}${btn('Другой вариант')}${btn('Применить','primary')}</div></section></div>`}
document.getElementById('root').innerHTML=base;
</script></body></html>
